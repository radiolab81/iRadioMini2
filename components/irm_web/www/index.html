<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iRadioMini2</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1c1e;--mut:#6b7280;--ac:#0a7ea4;--bd:#d1d5db}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8eaed;--mut:#9aa0a6;--ac:#4fc3f7;--bd:#2b3138}}
body{font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:34rem;margin:0 auto;padding:1rem}
h1{font-size:1.2rem;margin:.2rem 0}.mut{color:var(--mut);font-size:.85rem}
.now{border:1px solid var(--bd);border-radius:.6rem;padding:.8rem;margin:.8rem 0}.now b{font-size:1.1rem}
button{font:inherit;background:none;color:var(--fg);border:1px solid var(--bd);border-radius:.5rem;padding:.5rem .9rem;cursor:pointer}
button:hover{border-color:var(--ac)}.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0;align-items:center}
input[type=range]{flex:1;accent-color:var(--ac)}ul{list-style:none;padding:0;margin:0;max-height:16rem;overflow:auto;border:1px solid var(--bd);border-radius:.5rem}
li{padding:.5rem .7rem;border-bottom:1px solid var(--bd);cursor:pointer}li.cur{color:var(--ac);font-weight:600}
.eq{display:flex;gap:.3rem;justify-content:space-between}.eq div{text-align:center;font-size:.7rem}
.eq input{writing-mode:vertical-lr;direction:rtl;height:7rem;width:1.6rem}
</style></head><body>
<h1>iRadioMini2</h1><div class="mut" id="net"></div>
<div class="now"><div class="mut" id="state"></div><b id="name">–</b></div>
<div class="row"><button onclick="c('prev')">⏮</button><button onclick="c('toggle')">⏯</button><button onclick="c('next')">⏭</button>
<button onclick="c('toggle_source')" id="src">Quelle</button></div>
<div class="row"><span class="mut">Vol</span><input id="vol" type="range" min="0" max="100" oninput="vol(this.value)"><span id="vv" class="mut"></span></div>
<ul id="list"></ul>
<h2 style="font-size:1rem;margin-top:1.2rem">Equalizer</h2>
<div class="eq" id="eq"></div>
<div class="row"><button onclick="eq(true)">Speichern</button><button onclick="post('/api/eq',{action:'reset'})">Zurücksetzen</button></div>
<script>
const F=['31','62','125','250','500','1k','2k','4k','8k','16k'];let L=[],lastSrc='',busy=0;
const $=i=>document.getElementById(i);
async function post(u,b){try{await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}catch(e){}}
const c=(cmd,value)=>post('/api/cmd',{cmd,value}).then(()=>setTimeout(poll,300));
let vt;function vol(v){$('vv').textContent=v+'%';busy=Date.now();clearTimeout(vt);vt=setTimeout(()=>c('volume',+v),120)}
function eq(save){post('/api/eq',{gains:[...document.querySelectorAll('.eq input')].map(i=>+i.value),save})}
let et;function eqchg(){clearTimeout(et);busy=Date.now();et=setTimeout(()=>eq(false),150)}
$('eq').innerHTML=F.map((f,i)=>`<div><input type="range" min="-12" max="12" value="0" oninput="eqchg()"><br>${f}</div>`).join('');
async function poll(){try{
 const s=await (await fetch('/api/status')).json();
 $('net').textContent=s.net?'WLAN verbunden':'kein WLAN';
 $('state').textContent=s.player+(s.sample_rate?` · ${s.sample_rate/1000} kHz`:'')+(s.bitrate?` · ${Math.round(s.bitrate/1000)} kbit/s`:'');
 $('name').textContent=s.name||'–';$('src').textContent=s.source==='radio'?'Radio':'Dateien';
 if(Date.now()-busy>1500){$('vol').value=s.volume;$('vv').textContent=s.volume+'%';
  document.querySelectorAll('.eq input').forEach((e,i)=>e.value=s.eq[i])}
 if(lastSrc!==s.source+s.count){lastSrc=s.source+s.count;L=await (await fetch('/api/list')).json()}
 $('list').innerHTML=L.map((n,i)=>`<li class="${i===s.index?'cur':''}" onclick="c('goto',${i})">${n.replace(/[<&]/g,m=>m==='<'?'&lt;':'&amp;')}</li>`).join('');
}catch(e){$('net').textContent='keine Verbindung'}}
poll();setInterval(poll,2000);
</script></body></html>
